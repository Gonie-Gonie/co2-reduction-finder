[package]
name = "co2-reduction-finder"
version = "0.1.2"
description = "Native Rust dashboard app for CO2 reduction coefficient lookup"
authors = ["CO2 Reduction Finder Team"]
edition = "2024"

[dependencies]
eframe = { version = "0.34.2", default-features = false, features = ["default_fonts", "glow"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
