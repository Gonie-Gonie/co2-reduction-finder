name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile default --component rustfmt clippy
          rustup default 1.96.0

      - name: Cargo check
        run: cargo check

      - name: Rust tests
        run: cargo test

